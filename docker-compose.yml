services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecohome}
      POSTGRES_USER: ${POSTGRES_USER:-ecohome}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecohome-local}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ${POSTGRES_USER:-ecohome} -d ${POSTGRES_DB:-ecohome}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mqtt:
    image: eclipse-mosquitto:2
    volumes:
      - ./infra/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
    ports: ["1883:1883"]

  backend:
    build: ./backend
    environment:
      APP_VERSION: 1.1.0
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-development-secret-key-please-change}
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      POSTGRES_DB: ${POSTGRES_DB:-ecohome}
      POSTGRES_USER: ${POSTGRES_USER:-ecohome}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecohome-local}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
    command: sh -c "python manage.py migrate --noinput && gunicorn ecohome.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60 --access-logfile -"
    depends_on:
      db: {condition: service_healthy}
      mqtt: {condition: service_started}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

  mqtt-listener:
    build: ./backend
    environment:
      APP_VERSION: 1.1.0
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-development-secret-key-please-change}
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,backend
      POSTGRES_DB: ${POSTGRES_DB:-ecohome}
      POSTGRES_USER: ${POSTGRES_USER:-ecohome}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecohome-local}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
    command: python manage.py run_mqtt_listener
    depends_on:
      backend: {condition: service_healthy}
      mqtt: {condition: service_started}

  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on:
      backend: {condition: service_healthy}

volumes:
  postgres_data:
  mosquitto_data:
